<text x="35" y="953.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#193936">Предлагаемый процесс · v1.8.0 · интерфейс и BPMN одной версии</text>
<text x="35" y="996.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193936">Для уже подключённого сотрудника. В едином подключении полномочия берутся из приглашения; МЧД подписывает руководитель.</text>
