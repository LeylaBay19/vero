<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1060" viewBox="0 0 2480 1060" role="img"><title>Предлагаемый вариант · выдача полномочий сотруднику</title><rect width="100%" height="100%" fill="white"/>
