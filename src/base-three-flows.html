<script id="ap-logic">
(() => {
const root=document.getElementById('auth-flow-prototype');
const pane=root.querySelector('#ap-screen');
const saved=window.openai?.widgetState?.privateContent;
const localWriter=Math.random().toString(36).slice(2);
const S={flow:'mos',screen:'entry',repeat:false,orgCase:'new',history:[],email:'ivan@example.test',role:'Подрядчик',...((saved&&['mos','ep','orb'].includes(saved.flow))?{flow:saved.flow,repeat:!!saved.repeat,orgCase:saved.orgCase==='existing'?'existing':'new'}:{})};
const drafts={};
const draftKey=()=>S.flow+':'+S.orgCase+':'+S.screen;
function capture(){drafts[draftKey()]=[...pane.querySelectorAll('input,select')].filter(e=>e.type!=='password'&&!e.dataset.wasPassword).map(e=>({id:e.id,value:e.value,checked:e.checked}));}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(text,to,primary=true)=>`<button type="button" ${primary?'class="ap-primary"':''} data-go="${to}">${text.replace(/ · демо/g,'')}</button>`;
const field=(label,id,value='',type='text',readonly=false)=>`<label class="ap-field" for="${id}">${label}<input id="${id}" name="${id}" type="${type}" value="${esc(['surname','firstname','patronymic'].includes(id)?S.profile?.[id]||value:value)}" ${readonly?'readonly':''} autocomplete="off"></label>`;
const select=(label,id,options)=>options.length===1?field(label,id,'Выбор из справочника','text',true):`<label class="ap-field" for="${id}">${label}<select id="${id}" name="${id}">${options.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`;
const check=(label,id)=>`<label class="ap-check"><input type="checkbox" id="${id}" name="${id}"><span>${label}</span></label>`;
const wrap=(title,body,wide=false)=>`<div class="ap-form ${wide?'ap-wide':''}"><h2>${title}</h2>${body}</div>`;
const submit=(text,action)=>`<button class="ap-primary" type="submit" data-action="${action}">${text}</button>`;
const form=(body,action)=>`<form class="ap-form" data-form="${action}" novalidate>${body}<div class="ap-error" role="alert" hidden></div></form>`;
function persist(){
 const data={version:2,writer:localWriter,flow:S.flow,screen:S.screen,repeat:S.repeat,orgCase:S.orgCase};
 window.openai?.setWidgetState?.({modelContent:{scenario:S.flow,screen:S.screen,repeat:S.repeat,organization:S.orgCase},privateContent:data})?.catch(()=>{});
}
function go(screen){capture();S.history.push(S.screen);S.screen=screen;render();persist();}
function restart(){S.screen='entry';S.history=[];render();persist();}
function journey(q){
 let steps,title,intro;
 if(S.repeat){title='С возвращением';intro='Войдите в ранее настроенный личный кабинет.';steps=[['Вход','Подтверждение личности',['entry','orb-login','consent','mosid','certificate']],['Личный кабинет','Доступ к работе',['done']]];}

function enhance(){
 for(const item of drafts[draftKey()]||[]){const el=pane.querySelector('#'+item.id);if(el){el.value=item.value;if(el.type==='checkbox')el.checked=item.checked;}}
 pane.querySelectorAll('p.ap-muted').forEach(p=>{if(/прототип|уточн|демонстра|условн|здесь заканчивается/i.test(p.textContent))p.remove();});
 pane.querySelectorAll('.ap-description small').forEach(p=>{if(/здесь|демонстра/i.test(p.textContent))p.remove();});
 pane.querySelectorAll('input[type="password"]').forEach(input=>{
  const w=document.createElement('span');w.className='ap-pass-wrap';input.replaceWith(w);w.append(input);input.dataset.wasPassword='true';
  const b=document.createElement('button');b.type='button';b.className='ap-pass-toggle';b.dataset.password=input.id;b.textContent='Показать';b.setAttribute('aria-label','Показать пароль');b.setAttribute('aria-pressed','false');w.append(b);
 });
 root.querySelector('#ap-demo').hidden=!pane.querySelector('form');
 root.querySelector('.ap-brand-mark').textContent=S.flow==='orb'?'О':S.screen==='mosid'?'М':'Т';
 root.querySelector('#ap-demo-message').textContent=S.repeat?'Кабинет уже настроен':'Первое подключение';
 if(S.screen==='review'){
  const desc=pane.querySelector('.ap-description');
  if(desc){desc.querySelector('strong').textContent=[S.profile?.surname||'Иванов',S.profile?.firstname||'Иван',S.profile?.patronymic||''].filter(Boolean).join(' ')+' · ООО «Пример»';const contact=document.createElement('p');contact.textContent=S.email;contact.className='ap-muted';desc.append(contact);}
 }
 journey(S.screen);
}

root.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn||btn.disabled)return;
 if(btn.type==='submit'&&btn.closest('form[data-form]')){e.preventDefault();btn.closest('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}
 if(btn.dataset.flow){S.flow=btn.dataset.flow;restart();return;}
 if(btn.dataset.jump){go(btn.dataset.jump);return;}
 if(btn.dataset.go){if(btn.dataset.go==='certificate')S.flow='ep';if(btn.dataset.go==='consent')S.flow='mos';go(btn.dataset.go);return;}
 if(btn.dataset.role){S.role=btn.dataset.role;go('role-confirm');return;}
 if(btn.id==='ap-back'){if(S.history.length){capture();S.screen=S.history.pop();render();persist();}return;}
 if(btn.id==='ap-start'){restart();return;}
 if(btn.dataset.password){const input=pane.querySelector('#'+btn.dataset.password);const show=input.type==='password';input.type=show?'text':'password';btn.textContent=show?'Скрыть':'Показать';btn.setAttribute('aria-pressed',String(show));btn.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль');return;}
 if(btn.id==='ap-demo'){
  const examples={'surname':'Иванов','firstname':'Иван','patronymic':'Иванович','email':'ivan@example.test','person-email':'ivan@example.test','phone':'+7 (000) 000-00-00','org-phone':'+7 (000) 000-00-00','org-email':'office@example.test','invite-name':'Петров Пётр','invite-email':'petr@example.test','job-date':'2026-11-03','director':'Иванов Иван Иванович','director-job':'Генеральный директор','actual-address':'Адрес для примера'};
  pane.querySelectorAll('form input:not([readonly])').forEach(input=>{if(input.type==='checkbox')return;if(input.dataset.wasPassword)input.value='Example-2026!';else if(!input.value)input.value=examples[input.id]||'Пример';input.removeAttribute('aria-invalid');});
  pane.querySelector('[role="alert"]')?.setAttribute('hidden','');root.querySelector('#ap-demo-message').textContent='Пример заполнен · согласия отметьте сами';return;
 }
 if(btn.dataset.action==='add-invite'){
  const n=root.querySelectorAll('#ap-invites input').length;
  root.querySelector('#ap-invites').insertAdjacentHTML('beforeend',field('ФИО следующего сотрудника','invite-name-'+n,'')+field('E-mail','invite-email-'+n,'','email'));return;
 }
});
root.addEventListener('change',e=>{
 if(e.target.id==='ap-repeat'){S.repeat=e.target.checked;restart();}
 if(e.target.id==='ap-org-case'){S.orgCase=e.target.value;restart();}
});
root.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;const action=f.dataset.form;const val=id=>f.querySelector('#'+id)?.value.trim()||'';
 const err=(msg,ids=[])=>{const box=f.querySelector('[role="alert"]');box.textContent=msg;box.hidden=false;ids.forEach(id=>f.querySelector('#'+id)?.setAttribute('aria-invalid','true'));f.querySelector('[aria-invalid="true"]')?.focus();};
 f.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));
 if(action==='register'){
  const missing=['surname','firstname','email','new-password','confirm-password'].filter(id=>!val(id));if(missing.length)return err('Заполните поля регистрации.',missing);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email')))return err('Проверьте адрес электронной почты.',['email']);
  if(val('new-password')!==val('confirm-password'))return err('Пароли не совпадают.',['confirm-password']);
  S.email=val('email');S.profile={surname:val('surname'),firstname:val('firstname')};go('email');
 } else if(action==='orb-login'){
  if(!val('email')||!val('password'))return err('Введите email и пароль.',['email','password'].filter(id=>!val(id)));
  if(!f.querySelector('#agreements').checked)return err('Отметьте принятие документов, чтобы пройти демонстрационный сценарий.');
  S.email=val('email');go(S.repeat?'done':'first');
 } else if(action==='mos-login'){
  if(!val('mos-login')||!val('mos-password'))return err('Введите логин и пароль.',['mos-login','mos-password'].filter(id=>!val(id)));
  go(S.repeat?'done':'first');
 } else if(action==='org-search'){if(!val('org-query'))return err('Укажите организацию.');go('result');
 } else if(action==='person'){
  S.profile={surname:val('surname'),firstname:val('firstname'),patronymic:val('patronymic')};if(val('person-email'))S.email=val('person-email');
  if(S.flow!=='orb'){
   if(!f.querySelector('#pd').checked)return err('Отметьте согласие на обработку персональных данных.');go('person-fixed');
  }else go(S.orgCase==='new'?'company':'waiting');
 } else if(action==='authority')go('mchd');
 else if(action==='company')go(S.flow==='orb'?'sign':'activity');
});
root.addEventListener('input',e=>{if(e.target.hasAttribute('aria-invalid'))e.target.removeAttribute('aria-invalid');});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&e.target.closest('form[data-form]')){e.preventDefault();e.target.closest('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
window.addEventListener('openai:set_globals',e=>{
 const p=e.detail?.globals?.widgetState?.privateContent;
 if(p?.writer===localWriter)return;
 if(!p||p.version!==2||!['mos','ep','orb'].includes(p.flow))return;
 if(p.flow===S.flow&&p.screen===S.screen&&!!p.repeat===S.repeat&&p.orgCase===S.orgCase)return;
 capture();S.flow=p.flow;S.repeat=!!p.repeat;S.orgCase=p.orgCase==='existing'?'existing':'new';S.screen=typeof p.screen==='string'?p.screen:'entry';S.history=[];render();
});
if(saved?.version===2&&typeof saved.screen==='string')S.screen=saved.screen;
render();
})();
</script>
