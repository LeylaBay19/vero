</style></head><body><aside class="bench"><strong>ЛК по ТЗ 1.0 · v1.16.0</strong><label>Сценарий<select id="role"><option value="admin">Администратор</option><option value="employee">Сотрудник</option><option value="pending">Представитель до проверки</option><option value="personal">Физлицо</option></select></label><label>Экран<select id="catalog"></select></label><label>Состояние<select id="data-state"><option value="filled">Обычное</option><option value="loading">Загрузка</option><option value="empty">Пусто</option><option value="error">Ошибка загрузки</option><option value="denied">Нет доступа</option></select></label><button id="fill">Заполнить пример</button><button id="reset">Сбросить</button><small>Интерактивный макет. Данные и операции демонстрационные. Комиссия 5% — пример для экранов, сроки и тарифы не утверждены. Отправка, банк и электронная подпись не подключены.</small></aside><div class="app"><header><strong>ВЕРО</strong><span id="screen-id"></span><label id="context-wrap">Контекст<select id="context"><option value="personal">От своего имени</option><option value="org">ООО «Пример»</option><option value="other">ООО «Вектор»</option></select></label><button id="exit">Выйти</button></header><div class="body"><nav id="nav" aria-label="Разделы ЛК"></nav><main id="main"></main></div></div><script>(()=>{'use strict';
const catalog=[{"id": "LK-01", "title": "Вход", "role": "Все", "content": "Логин, пароль, восстановление, ошибки авторизации."}, {"id": "LK-02", "title": "Создание учётной записи", "role": "Новый пользователь", "content": "Минимальная регистрация и согласия."}, {"id": "LK-03", "title": "Выбор типа участия", "role": "Новый пользователь", "content": "Физлицо или представитель юрлица; возможность продолжить позже."}, {"id": "LK-04", "title": "Регистрация юрлица", "role": "Представитель", "content": "Название/реквизиты, роли юрлица в сотах, сохранение черновика."}, {"id": "LK-05", "title": "Подтверждение полномочий", "role": "Представитель", "content": "Способ проверки, загрузка/подписание, статус и ошибки."}, {"id": "LK-06", "title": "Статус проверки", "role": "Представитель", "content": "На проверке, нужны данные, подтверждено, отклонено."}, {"id": "LK-07", "title": "Главная ЛК", "role": "Все", "content": "Карточки рабочих пространств, роль, контекст, незавершённые действия."}, {"id": "LK-08", "title": "Каталог рабочих пространств", "role": "Все", "content": "Поиск/фильтр при большом числе сот и ролей."}, {"id": "LK-09", "title": "Профиль пользователя", "role": "Все", "content": "Личные данные, контакты, добровольное дополнение профиля."}, {"id": "LK-10", "title": "Безопасность", "role": "Все", "content": "Пароль, активные сессии, подтверждение чувствительных действий."}, {"id": "LK-11", "title": "Банковские реквизиты", "role": "Физлицо и администратор", "content": "Список счетов, подтверждение, добавление и изменение."}, {"id": "LK-12", "title": "Организация", "role": "Администратор", "content": "Карточка юрлица, статус, данные, доступные действия."}, {"id": "LK-13", "title": "Пользователи организации", "role": "Администратор", "content": "Список, поиск, роли, статус приглашения."}, {"id": "LK-14", "title": "Добавление пользователя", "role": "Администратор", "content": "Контакты, роли, продукты, подтверждение приглашения."}, {"id": "LK-15", "title": "Карточка пользователя", "role": "Администратор", "content": "Роли, права, блокировка и удаление из организации."}, {"id": "LK-16", "title": "Роли организации", "role": "Администратор", "content": "Роли в сотах, запрос новых ролей, ограничения."}, {"id": "LK-17", "title": "Документы", "role": "По правам", "content": "Список, тип, источник, статус, скачивание."}, {"id": "LK-18", "title": "Уведомления", "role": "Все", "content": "Категории, прочитано/не прочитано, переход к объекту."}, {"id": "LK-19", "title": "Нет доступа", "role": "Все", "content": "Причина, текущий контекст и способ запросить доступ."}, {"id": "W-01", "title": "Обзор кошелька", "role": "Физлицо, администратор", "content": "Доступно, зарезервировано, ожидается, действия, обязательства, последние операции."}, {"id": "W-02", "title": "Ограничение операций", "role": "По контексту", "content": "Причина, доступные разделы, действие для снятия ограничения."}, {"id": "W-03", "title": "Создание пополнения", "role": "Управляющий кошельком", "content": "Сумма, источник, срок, комиссия, подтверждение."}, {"id": "W-04", "title": "Реквизиты пополнения", "role": "Управляющий кошельком", "content": "Реквизиты, назначение, копирование, скачивание счёта."}, {"id": "W-05", "title": "Статус пополнения", "role": "Управляющий кошельком", "content": "Ожидает, получено банком, проверка, зачислено, уточнение, возврат."}, {"id": "W-06", "title": "Создание вывода", "role": "Управляющий кошельком", "content": "Счёт, сумма, комиссия, итог, подтверждение."}, {"id": "W-07", "title": "Статус вывода", "role": "Управляющий кошельком", "content": "Хронология, текущий статус, причина отказа или возврата."}, {"id": "W-08", "title": "Операции", "role": "По правам", "content": "Период, тип, статус, поиск, пагинация, экспорт."}, {"id": "W-09", "title": "Карточка операции", "role": "По правам", "content": "Номер, сумма, комиссия, основание, остаток, контракт, документы."}, {"id": "W-10", "title": "Выписки", "role": "По правам", "content": "Запрос периода, очередь формирования, список документов."}, {"id": "W-11", "title": "Просмотр выписки", "role": "По правам", "content": "PDF , сведения об УКЭП, скачивание подписи."}, {"id": "W-12", "title": "Новая сверка", "role": "Управляющий кошельком", "content": "Период, операция, ожидаемый результат, описание, вложения."}, {"id": "W-13", "title": "Карточка сверки", "role": "Управляющий кошельком", "content": "Статус, оператор, переписка, вложения, заключение."}, {"id": "W-14", "title": "Прогноз средств", "role": "Управляющий кошельком", "content": "7/30/90 дней, обязательства, дефицит, рекомендация пополнения."}, {"id": "W-15", "title": "Платёж заказчика", "role": "Заказчик", "content": "Резерв, условие выплаты, подтверждение исполнения, открытие спора."}, {"id": "W-16", "title": "Ожидаемая выплата", "role": "Исполнитель", "content": "Обеспеченность, сумма до комиссии, комиссия, к получению, следующий шаг."}, {"id": "W-17", "title": "Комиссия", "role": "Обе стороны по правилам", "content": "Расшифровка расчёта и ссылка на тариф/условия."}, {"id": "W-18", "title": "Недостаточно средств", "role": "Заказчик", "content": "Недостающая сумма, срок и переход к пополнению."}, {"id": "W-19", "title": "Платёж требует уточнения", "role": "Управляющий кошельком", "content": "Причина, документы и обращение в поддержку."}, {"id": "W-20", "title": "Спор по контракту", "role": "Заказчик и исполнитель", "content": "Статус, сохранённый резерв, материалы и ожидаемое решение."}], $=id=>document.getElementById(id),main=$('main');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=v=>(v/100).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
const amount=s=>/^\d+(?:[.,]\d{1,2})?$/.test(String(s).replace(/[\s₽]/g,''))?Math.round(Number(String(s).replace(/[\s₽]/g,'').replace(',','.'))*100):NaN;
const button=(t,action,primary=false,attrs='')=>`<button type="button" ${primary?'class="primary"':''} data-action="${action}" ${attrs}>${t}</button>`;
const jump=(t,id,primary=false)=>button(t,'go',primary,`data-id="${id}"`);
const field=(t,id,type='text',value='',attrs='')=>`<label class="field" for="${id}">${t}<input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${attrs} aria-describedby="error-${id}"><span id="error-${id}" class="field-error"></span></label>`;
const select=(t,id,options,value='')=>`<label class="field" for="${id}">${t}<select id="${id}" name="${id}" aria-describedby="error-${id}">${options.map(([v,label])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(label)}</option>`).join('')}</select><span id="error-${id}" class="field-error"></span></label>`;
const check=(t,id,attrs='')=>`<label class="check"><input type="checkbox" id="${id}" name="${id}" ${attrs}><span>${t}</span></label>`;
const form=(kind,body,label='Продолжить')=>`<form data-form="${kind}" novalidate>${body}<button class="primary" type="submit">${label}</button><div id="error" class="error" role="alert"></div></form>`;
const panel=(t,body)=>`<section class="panel"><h2>${t}</h2>${body}</section>`;
const choices=[['expert','Экспертиза'],['permit','Разрешения'],['control','Контроль']];
let S;const accounts=[{login:'demo',email:'demo@example.test',password:'Example-2026!'}];
function fixture(){return {available:124000000,reserved:48000000,incoming:21500000,pending:0,banks:[{id:'bank-1',name:'Собственный банковский счёт',account:'40702810000000000001',bik:'000000000',confirmed:true}],operations:[{id:'op-1',type:'Пополнение',status:'Зачислено',sum:50000000,date:'2026-11-05',basis:'Платёж ДЕМО-001'},{id:'op-2',type:'Резервирование',status:'Зарезервировано',sum:-32000000,date:'2026-11-03',basis:'Контракт №184'},{id:'op-3',type:'Выплата',status:'Исполнено',sum:17550000,date:'2026-11-01',basis:'Контракт №147'},{id:'op-4',type:'Комиссия',status:'Исполнено',sum:-1950000,date:'2026-11-01',basis:'Контракт №147'}],statements:[],reconciliations:[],users:[{id:'anna',name:'Анна Петрова',email:'anna@example.test',role:'Специалист',products:['expert'],status:'Активен'}],requests:[]};}
function reset(){S={screen:'LK-01',auth:false,context:'org',role:'admin',history:[],contact:false,contactEmail:'',signup:null,profile:{name:'Иван Иванов',email:'demo@example.test',phone:''},contexts:{org:fixture(),other:fixture(),personal:fixture()},orgStatus:'На проверке',orgDraft:{},modal:null,selected:null,topup:null,withdraw:null,statement:null,reconciliation:null,contract:{reserved:32000000,status:'Зарезервировано'},filters:{q:'',type:'',status:'',from:'',until:'',page:1},roles:['Заказчик'],notice:'',bankEditing:null};S.contexts.personal.available=8250000;S.contexts.personal.reserved=1500000;S.contexts.personal.incoming=0;S.contexts.other.available=3400000;Object.values(S.contexts).forEach(x=>x.contract={reserved:32000000,status:'Зарезервировано'});S.contexts.personal.contract.reserved=1000000;S.contract=S.contexts.org.contract;$('role').value='admin';$('context').value='org';$('data-state').value='filled';render();}
const data=()=>S.contexts[S.context], name=()=>S.context==='personal'?'Личный кабинет':S.context==='org'?'ООО «Пример»':'ООО «Вектор»';
const role=()=>S.context==='personal'?'personal':S.role==='pending'?'pending':S.context==='other'?'employee':S.role;
const finance=()=>S.auth&&['admin','personal'].includes(role()), admin=()=>S.auth&&role()==='admin';
const bankOptions=()=>data().banks.filter(b=>b.confirmed).map(b=>[b.id,b.name+' · •••• '+b.account.slice(-4)]);
function go(id){if(!catalog.some(c=>c.id===id))return;S.history.push(S.screen);S.screen=id;S.modal=null;S.notice='';render();main.scrollTop=0;main.querySelector('h1')?.focus();}
function error(text,id){const el=$(id),box=id&&$('error-'+id)||$('modal-error')||$('error');if(box)box.textContent=text;if(el){el.setAttribute('aria-invalid','true');el.focus();}return false;}
function toast(text){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),4000);}
function download(filename,text,type='text/plain'){const a=document.createElement('a');a.href='data:'+type+';charset=utf-8,'+encodeURIComponent(text);a.download=filename;a.click();}
function moneyCards(){return `<div class="metrics"><div class="metric"><small>Доступно</small><strong>${rub(data().available)}</strong><small>Для новых платежей и вывода</small></div><div class="metric"><small>Зарезервировано</small><strong>${rub(data().reserved)}</strong><small>Средства по контрактам</small></div><div class="metric"><small>Ожидается</small><strong>${rub(data().incoming)}</strong><small>Будущие выплаты</small></div></div>${data().pending?'<div class="notice">На выводе: '+rub(data().pending)+'</div>':''}`;}
function spaces(){return `<div class="cards">${choices.map(([id,t])=>`<article class="panel"><h2>${t}</h2><p>Роль: ${role()==='admin'?'Администратор':role()==='personal'?'Заявитель':'Специалист'}</p><p class="small">${esc(name())}</p>${button('Открыть','workspace',false,`data-name="${t}"`)}</article>`).join('')}</div>`;}
function operations(){let rows=data().operations.filter(x=>(!S.filters.q||(x.basis+' '+x.type).toLowerCase().includes(S.filters.q.toLowerCase()))&&(!S.filters.type||x.type===S.filters.type)&&(!S.filters.status||x.status===S.filters.status)&&(!S.filters.from||x.date>=S.filters.from)&&(!S.filters.until||x.date<=S.filters.until));return rows;}
function operationRows(rows){return `<div class="table-wrap"><table><thead><tr><th>Операция</th><th>Основание / дата</th><th>Статус</th><th>Сумма</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.basis)}<br>${esc(x.date)}</td><td>${esc(x.status)}</td><td>${x.sum>0?'+ ':''}${rub(x.sum)}</td><td>${button('Открыть','operation',false,`data-key="${x.id}"`)}</td></tr>`).join('')||'<tr><td colspan="5">Операции не найдены</td></tr>'}</tbody></table></div>`;}
function timeline(values,current){return `<ol class="timeline">${values.map(v=>`<li ${v===current?'class="current" aria-current="step"':''}>${v===current?'● ':'○ '}${v}</li>`).join('')}</ol>`;}
function statusControl(values,value){return `<div class="notice"><label class="field">Демо: результат проверки<select id="process-state">${values.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select></label>${button('Показать результат','apply-state')}</div>`;}
