<text x="1370.0" y="585.18" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">подписанную МЧД</text>
<rect x="1720" y="520" width="300" height="100" rx="10" fill="#f0f6f4" stroke="#8ba6a1" stroke-width="2"/>
<text x="1870.0" y="539.64" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">Показать сотруднику</text>
<text x="1870.0" y="570.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">оформленные</text>
<text x="1870.0" y="600.36" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">полномочия</text>
<circle cx="2167.0" cy="570.0" r="17.0" fill="white" stroke="#193936" stroke-width="5"/>
<text x="2167.0" y="630.12" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#193936">МЧД</text>
<text x="2167.0" y="653.88" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#193936">подписана</text>
<text x="35" y="943.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#193936">Предлагаемый процесс · v1.1.0 · интерфейс и BPMN одной версии</text>
<text x="35" y="986.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193936">Для уже подключённого сотрудника. В едином подключении полномочия берутся из приглашения; МЧД подписывает руководитель.</text>
</svg>