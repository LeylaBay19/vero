<rect x="150" y="210" width="260" height="100" rx="10" fill="#ffffff" stroke="#8ba6a1" stroke-width="2"/>
<text x="280.0" y="244.82" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">Выбрать полномочия</text>
<text x="280.0" y="275.18" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">чекбоксами</text>
<rect x="450" y="520" width="260" height="100" rx="10" fill="#f0f6f4" stroke="#8ba6a1" stroke-width="2"/>
<text x="580.0" y="539.64" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">Сформировать МЧД</text>
<text x="580.0" y="570.0" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">по выбранным</text>
<text x="580.0" y="600.36" dominant-baseline="central" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#193936">правам</text>
