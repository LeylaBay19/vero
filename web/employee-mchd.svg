<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1060" viewBox="0 0 2300 1060" role="img"><title>Предлагаемый вариант · выдача полномочий сотруднику</title><rect width="100%" height="100%" fill="white"/>
<text x="35" y="40.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#193936">Предлагаемый вариант · выдача полномочий сотруднику</text>
<text x="35" y="88.0" dominant-baseline="central" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#193936">Организация и сотрудник уже подключены. Обычный доступ к кабинету не требует оформления этой МЧД.</text>
